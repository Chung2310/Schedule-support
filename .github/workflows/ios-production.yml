name: App CI and Production iOS IPA

on:
  push:
    branches:
      - develop
      - production
  pull_request:
    branches:
      - develop
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check reminder and storage regressions
        run: npm test

      - name: Generate public privacy policy
        run: |
          npm run legal:build
          git diff --exit-code -- docs/index.html docs/privacy-policy.html

      - name: Check Expo dependencies and configuration
        run: npx expo-doctor

      - name: Check generated iOS privacy declarations
        run: npm run ios:check

  build-ios:
    name: Build production IPA on GitHub macOS
    if: ${{ github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: validate
    runs-on: macos-26
    timeout-minutes: 90
    concurrency:
      group: ios-production-build
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_PRIVACY_POLICY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_POLICY_URL }}
      EXPO_PUBLIC_SUPPORT_URL: ${{ vars.EXPO_PUBLIC_SUPPORT_URL }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production build configuration
        run: |
          node scripts/build-ios.cjs --check
          npm run ios:check

      - name: Verify Expo project access
        run: npx --yes eas-cli@latest project:info

      - name: Check macOS build tools
        run: |
          node --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
          fastlane --version
          python3 --version

      - name: Build signed production IPA locally
        run: npm run build:ios

      - name: Validate signed IPA and write build summary
        run: python3 scripts/check-ios-artifact.py "$RUNNER_TEMP/ios-artifacts/schedule-support.ipa"

      - name: Save validated IPA and build information
        uses: actions/upload-artifact@v4
        with:
          name: schedule-support-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-artifacts/schedule-support.ipa
            ${{ runner.temp }}/ios-artifacts/build-info.json
          if-no-files-found: error
          retention-days: 7
